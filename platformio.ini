; ============================================================================
; CYD Wi-Fi CSI Radar — platformio.ini
; Target: ESP32-2432S028R ("Cheap Yellow Display")
; ============================================================================
[env:esp32dev]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino

; --- Serial ---
monitor_speed = 115200
upload_speed = 921600

; --- Partition scheme: default 4MB w/ OTA disabled, app gets more room.
; CYD boards ship with 4MB flash. "no_ota" gives ~3MB to the app partition,
; which we don't need, but avoids OTA partition overhead we're not using.
board_build.partitions = default.csv
board_build.flash_mode = dio

; --- Libraries ---
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43

; --- Build flags ---
; TFT_eSPI is configured via build_flags instead of User_Setup.h so the
; config travels with the repo instead of requiring a manual library edit.
build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1          ; CYD's ILI9341 variant (BGR order quirk)
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D USE_HSPI_PORT=1
    -std=c++17
    -Wall
    -Wextra
build_unflags =
    -std=gnu++11

; XPT2046 touch is wired but not used by this application (radar is
; display-only). Left disabled to save cycles; see gui_manager.h to enable.
