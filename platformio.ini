; ============================================================================
; CYD Wi-Fi CSI Radar — platformio.ini
; Target: ESP32-2432S028R ("Cheap Yellow Display")
; ============================================================================
[env:esp32dev]
; Pinned to a platform+framework pair that is actually known-compatible.
; 6.7.0 was previously specified here, but PlatformIO's registry currently
; resolves its "compatible" framework-arduinoespressif32 to a 3.20016.0
; (Arduino-ESP32 core 3.x) build, which is a different major API/ABI
; generation than what 6.7.0's toolchain (xtensa GCC 8.4.0) was built
; against — that mismatch is what produced the typeof()/statement-expression
; compile errors in tools/sdk headers. 6.9.0 pins Arduino-ESP32 core 2.0.17,
; which matches this GCC 8.4.0 toolchain and is the combination most
; commonly reported working for TFT_eSPI + esp_wifi CSI projects as of
; early-to-mid 2026. If a future `pio run` still resolves to a 3.x
; framework here, pin platform_packages explicitly (see PlatformIO's
; espressif32 docs) rather than assuming the platform version alone locks it.
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

; --- Serial ---
monitor_speed = 115200
upload_speed = 921600

; --- Partition scheme: default 4MB w/ OTA disabled, app gets more room.
; CYD boards ship with 4MB flash. "no_ota" gives ~3MB to the app partition,
; which we don't need, but avoids OTA partition overhead we're not using.
board_build.partitions = default.csv
board_build.flash_mode = dio

; --- Libraries ---
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43

; --- Build flags ---
; TFT_eSPI is configured via build_flags instead of User_Setup.h so the
; config travels with the repo instead of requiring a manual library edit.
build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1          ; CYD's ILI9341 variant (BGR order quirk)
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D USE_HSPI_PORT=1
    -Wall
    -Wextra

; NOTE: previously this file also set `-std=c++17` and unflagged the
; framework's default `-std=gnu++11`. That was unnecessary — nothing in
; this codebase requires C++17 — and it was the actual root cause of the
; `typeof()` / `portGET_ARGUMENT_COUNT()` build failures reported against
; this project, not a platform/framework version mismatch. Arduino-ESP32's
; IDF 4.x headers (freertos/portmacro.h, hal/gpio_ll.h, hal/misc.h) rely on
; GNU C++ extensions that gnu++11 provides and strict c++17 does not
; guarantee. Left at the framework default on purpose; do not re-add
; -std=c++17 without also confirming these specific headers still compile
; under it for whatever framework version is in use at the time.

; XPT2046 touch is wired but not used by this application (radar is
; display-only). Left disabled to save cycles; see gui_manager.h to enable.
